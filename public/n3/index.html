umns:minmax(0,1.65fr) minmax(275px,1fr);margin-top:19px;align-items:start}.stack{display:grid;gap:16px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.row+.row,.card h2+p,.card h2+.row{margin-top:12px}.primary{background:#285840;color:white;border-color:#285840}.primary:hover:enabled{background:#183d2c}.datebar{margin:22px 0 12px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}.tabs button{flex:1}.prompt{font-size:21px;line-height:1.8;white-space:pre-line;margin:18px 0}.opts{display:grid;gap:8px}.opts button{text-align:left}.opts b{display:inline-block;width:30px;color:#698269}.controls,.result{margin-top:16px}.result{padding:14px;background:#f0f5eb;border-radius:10px}.list{padding:0;list-style:none}.list li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8df;padding:8px 0;gap:8px}.list li button{flex:none}.bar{height:7px;border-radius:4px;background:#e8ede5;margin:5px 0 12px}.bar i{display:block;height:100%;background:#729464;border-radius:4px}.chip{font-size:14px;color:#526b52;background:#eaf2e5;border-radius:25px;padding:3px 10px}details summary{cursor:pointer;font-weight:bold}label{display:inline-flex;align-items:center;gap:7px}.timer{font-variant-numeric:tabular-nums;font-weight:700}.planline{border-top:1px solid #e4e9df;padding-top:12px;margin-top:12px}.meta{font-size:14px}.days{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.days button{min-width:40px;padding:6px}button.done{background:#dfecd7}.active{outline:2px solid #356646}.hide{display:none}@media(max-width:740px){header,main{padding-left:15px;padding-right:15px}.hero{padding:24px;min-height:175px}.art{right:0;opacity:.6;transform:scale(.65);transform-origin:right center}.hero>div:first-child{max-width:72%}.metrics{grid-template-columns:repeat(2,1fr);gap:8px}.layout{grid-template-columns:1fr}.stat,.card{padding:16px}.stat strong{font-size:22px}header{min-height:62px}.prompt{font-size:19px}}
</style><header><b>코토바 <span>Kotoba</span></b><span class="meta">JLPT N3 학습 정원</span></header><main><section class="hero"><div><small>日本語の練習帳</small><h1>하루 20분, N3 연습</h1><p>12월 6일 시험까지 · 어휘 · 문법 · 독해</p></div><div class="art" aria-hidden="true"><i class="sun"></i><i class="book">日 本</i></div></section><section class="metrics" id="metrics"></section><div class="row space datebar"><h2>날짜별 학습</h2><label>학습일 <input type="date" id="date" min="2026-11-25" max="2026-12-06"></label></div><div class="days" id="days"></div><div class="layout"><div class="stack"><section class="card"><div class="row space"><h2>오늘의 문제</h2><span class="chip" id="status"></span></div><div class="row space"><label>집중 영역 <select id="focus"></select></label><div class="row"><span class="timer" id="clock"></span><button id="timer"></button></div></div><div class="tabs" id="tabs"></div><div id="quiz"></div></section><section class="card"><h2>복습 노트</h2><p class="muted meta">마지막 풀이가 오답인 문제 중 자주 틀린 문제부터 보여줘요.</p><div id="review"></div></section></div><aside class="stack"><section class="card"><h2>영역별 정답률</h2><div id="weak"></div></section><section class="card"><h2>학습 계획</h2><div id="plan"></div></section></aside></div><footer class="planline meta muted">코토바 N3 연습 기록은 현재 브라우저에 저장됩니다. <a id="back" hidden href="../">코토바 홈</a></footer></main><script>const bank=[["변경","予定を変更する。「変更」の読み方は？","へんこう","へんごう","べんこう","へんこ","変更（へんこう）는 이미 정한 내용이나 일정을 바꾸는 것입니다."],["間に合う","急げば、最終電車に（　）。","間に合う","似合う","付き合う","見合う","間に合う는 정해진 시각에 늦지 않고 닿는다는 뜻입니다."],["預かる","店員が客の荷物を（　）。","預かる","預ける","届け出る","申し込む","맡아 주는 쪽은 預かる, 맡기는 쪽은 預ける를 씁니다."],["確かめる","出発前に、住所が正しいか（　）。","確かめた","暖めた","縮めた","眺めた","確かめる（たしかめる）는 맞는지 직접 확인하는 동작입니다."],["余裕","「時間に余裕がある」の意味は？","시간이 넉넉하다","시간이 부족하다","시간이 정확하다","시간을 착각하다","余裕（よゆう）는 쓰고도 남는 시간이나 여력을 뜻합니다."],["断る","「誘いを断った」の意味は？","권유를 거절했다","약속을 앞당겼다","초대를 받았다","대화를 끊었다","断る（ことわる）는 여기서 상대의 제안을 거절한다는 뜻입니다."],["締切","「応募の締切」の読み方は？","しめきり","しめぎり","しまきり","しまり","締切（しめきり）는 신청 등을 받는 마감입니다."],["片付く","片付けが終わって、部屋が（　）。","片付いた","片付けた","片寄った","片寄せた","部屋が片付く는 방이 정리되었다는 결과이고 部屋を片付ける는 방을 정리하는 행동입니다."],["見送る","駅で、留学する友人を見送った。何をした？","떠나는 친구를 배웅했다","친구를 마중했다","친구를 지나쳤다","친구를 초대했다","見送る（みおくる）는 떠나는 사람을 배웅한다는 뜻입니다."],["延期","雨のため試合は来週に（　）された。","延期","延長","終了","短縮","날짜를 미루면 延期, 진행 시간 등을 늘리면 延長입니다."],["うっかり","定期券をうっかり家に忘れた。「うっかり」は？","깜빡하고","일부러","겨우","차근차근","주의하지 못해서 실수한 상황을 나타냅니다."],["支度","「旅行の支度をする」の意味は？","여행 준비를 하다","여행을 취소하다","여행기를 쓰다","여행비를 내다","支度（したく）는 필요한 물건이나 옷차림 등을 준비하는 것입니다."],["うちに","温かい（　）、召し上がってください。","うちに","わりに","たびに","末に","温かいうちに는 따뜻한 상태가 바뀌기 전에 먹으라는 뜻입니다."],["ことになる","会社の決定で、来月転勤する（　）。","ことになった","ことにした","ところだった","最中だった","외부 결정으로 정해진 일에는 ことになる, 본인의 결정에는 ことにする를 씁니다."],["たばかり","先週引っ越してきた（　）で、この辺はまだよく知りません。","ばかり","ところに","うち","はずに","たばかり는 화자가 어떤 일이 일어난 지 얼마 안 됐다고 느끼는 표현입니다."],["ように","後ろの人にも聞こえる（　）、大きな声で話した。","ように","ためで","ほどの","ままに","聞こえる처럼 의지로 직접 조절하기 어려운 결과를 목표로 할 때 ように를 씁니다."],["ておく","明日の会議で使うので、資料をコピーして（　）。","おいた","あった","いたがった","みえた","ておく는 나중의 일을 위해 미리 해 두는 동작입니다."],["わけではない","甘い物が全部嫌いな（　）。ケーキは好きだ。","わけではない","にちがいない","はずがある","ことにする","全部〜わけではない는 전부 싫다는 것은 아니라는 부분 부정입니다."],["そうだ","空が暗い。今にも雨が（　）そうだ。","降り","降る","降って","降った","모양을 보고 곧 일어날 듯하다고 할 때는 동사의 ます형 어간에 そうだ를 붙입니다."],["しか～ない","財布には百円（　）入っていない。","しか","までに","ばかりに","ほどに","しか는 부정형과 함께 쓰여 백 엔밖에 없다는 제한을 나타냅니다."],["ながら","音楽を（　）ながら、部屋を掃除した。","聞き","聞く","聞いて","聞いた","동시에 하는 동작은 ます형 어간＋ながら로 연결합니다."],["によると","天気予報（　）、明日は雪が降るそうです。","によると","にとって","についての","に向かって","정보의 출처는 によると로 표시하고 전해 들은 내용은 そうだ로 마칩니다."],["たびに","この写真を見る（　）、旅行を思い出す。","たびに","うえでの","ままの","最中の","見るたびに는 볼 때마다 같은 일이 되풀이됨을 나타냅니다."],["ところだった","あと少しで電車に乗り遅れる（　）。","ところだった","ことにした","ものにした","ためだった","あと少しで〜ところだった는 하마터면 그렇게 될 뻔했다는 뜻입니다."],["반납함 안내","図書館は月曜休館です。休館中、本は入口の箱へ。CDは開館日に受付へお持ちください。月曜にCDを返したい人はどうしますか。","開館日に受付に持っていく","月曜に箱に入れる","月曜に受付に渡す","郵送する","반납함에 넣을 수 있는 것은 책입니다. CD에는 개관일 창구 반납 조건이 붙습니다."],["변경된 약속","「明日三時に駅の前」と言いましたが、雨の予報なので、時間はそのままで駅の中の本屋にしましょう。何が変わりましたか。","待ち合わせ場所","待ち合わせ時間","会う日","駅の名前","時間はそのままで는 시간을 유지한다는 뜻입니다. 장소만 역 안 서점으로 바뀌었습니다."],["수강 신청","料理教室の申し込みは金曜までです。参加費は当日、教室で払ってください。金曜までに必要なのは何ですか。","申し込むこと","参加費を払うこと","材料を買うこと","教室に行くこと","신청 마감과 참가비 납부 시점을 구별합니다. 当日는 수업 당일입니다."],["열차 운행","事故のため、急行は運転を見合わせています。各駅停車は通常どおりです。今、利用できるのはどれですか。","各駅停車","急行だけ","すべての電車","どの電車も利用できない","運転を見合わせる는 운행을 보류한다는 뜻입니다. 각역정차 열차는 평소대로 운행합니다."],["점심 주문","ランチには飲み物が付きます。ただし、持ち帰りの場合は飲み物が付きません。店内でランチを食べる人は？","飲み物が付く","飲み物を持参する","持ち帰りだけ選べる","飲み物代が必ず別になる","ただし는 예외를 도입합니다. 음료 제외는 포장 주문에만 적용됩니다."],["자료 제출","レポートは木曜の授業で集めます。欠席する人だけ、水曜の夜までにメールで送ってください。木曜に出席する人は？","授業で出す","水曜に必ずメールする","金曜に郵送する","提出しなくてよい","メール 접수 조건은 欠席する人だけ입니다. 출석자는 수업 중 제출합니다."],["배송 안내","午前中の注文は当日発送します。土日は発送しません。土曜の朝に注文した品は、次の営業日が月曜ならいつ発送されますか。","月曜","土曜","日曜","金曜","당일 발송 규칙에 주말 제외 조건이 있으므로 다음 영업일인 월요일에 발송합니다."],["강의실 변경","午後の講座は二階で行う予定でしたが、工事のため三階で行います。受付は一階のままです。受付の後、どこへ行きますか。","三階","一階","二階","建物の外","접수처는 그대로이고 수업 장소가 2층에서 3층으로 바뀌었습니다."],["할인 조건","会員カードを見せると本が一割引きになります。雑誌は対象外です。カードを持って雑誌だけ買うと？","通常の値段を払う","一割引きになる","無料になる","次回必ず割引になる","対象外는 적용 대상에서 제외한다는 뜻이므로 잡지는 정상가입니다."],["우산 대여","貸し傘は翌日までに、借りた店へ返してください。他の支店では返せません。正しい返し方は？","翌日までに同じ店へ返す","いつでも本店へ返す","当日中に駅へ返す","翌週どの店でも返せる","기한은 翌日まで, 장소는 借りた店이라는 두 조건을 모두 만족해야 합니다."],["공연 입장","開場は六時、開演は六時半です。演奏中は入場できません。六時四十分に来たら、休憩までお待ちください。遅れた人はいつ入れますか。","休憩のとき","六時四十分すぐ","演奏の途中いつでも","六時前だけ","開場은 문을 여는 시각, 開演은 공연 시작입니다. 연주 중에는 입장할 수 없습니다."],["좌석 이용","自習席は予約した人が優先です。予約がない人も、空いていれば使えます。予約していない人について正しいのは？","空席があれば使える","いつでも優先される","全く使えない","予約した人を移動させられる","優先은 우선권을 뜻합니다. 빈자리에 한해 예약하지 않은 사람도 이용할 수 있습니다."]];
const names=['어휘','문법','독해'];
const dates=Array.from({length:12},(_,i)=>new Date(Date.UTC(2026,10,25+i)).toISOString().slice(0,10));
const nowDay=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
const $=id=>document.getElementById(id);
const key='kotoba.n3.practice.v1';
let db=JSON.parse(localStorage.getItem(key)||'{"days":{},"log":[],"saved":{}}');
let day=dates.includes(nowDay)?nowDay:(nowDay<dates[0]?dates[0]:dates[11]);
let id,choice=null,feedback=null,explain=false;
const dayState=()=>db.days[day]??=( {focus:'',library:false,goal:'',done:false,elapsed:0,start:0} );
function save(){localStorage.setItem(key,JSON.stringify(db))}
function attempts(q){return db.log.filter(x=>x.id===q)}
function latest(q){return attempts(q).at(-1)}
function elapsed(d){return Math.min(1200000,d.elapsed+(d.start?Date.now()-d.start:0))}
function stop(d){d.elapsed=elapsed(d);d.start=0;save()}
function openQ(q){id=q;choice=null;feedback=null;explain=false;render()}
function baseQ(area){return area*12+dates.indexOf(day)}
function dateOpen(v){if(!dates.includes(v))return;stop(dayState());day=v;const d=dayState();openQ(baseQ(d.focus===''?dates.indexOf(day)%3:Number(d.focus)))}
function score(list){return list.length?Math.round(list.filter(x=>x.ok).length/list.length*100)+'%':'—'}
function retryList(){return bank.map((_,i)=>i).filter(i=>latest(i)&&!latest(i).ok).sort((a,b)=>attempts(b).filter(x=>!x.ok).length-attempts(a).filter(x=>!x.ok).length||latest(b).time-latest(a).time)}
function render(){
 const d=dayState(), area=Math.floor(id/12),today=db.log.filter(x=>x.day===day),retry=retryList();
 $('date').value=day;$('focus').value=d.focus;
 $('status').textContent=d.done?'학습 완료':today.length?'학습 중':'시작 전';
 $('days').innerHTML=dates.map((v,i)=>'<button aria-label="'+v+'" class="'+(v===day?'active ':'')+(db.days[v]?.done?'done':'')+'" data-day="'+v+'">'+(i===0||v.endsWith('01')?Number(v.slice(5,7))+'/':'')+Number(v.slice(-2))+(db.days[v]?.done?' ✓':'')+'</button>').join('');
 $('metrics').innerHTML=[['선택일 학습',d.done?'완료':today.length?'진행 중':'시작 전'],['누적 정답률',score(db.log)],['누적 학습일',new Set(db.log.map(x=>x.day)).size+'일'],['다시 풀 문제',retry.length+'개']].map(([t,n])=>'<div class="stat"><small>'+t+'</small><strong>'+n+'</strong></div>').join('');
 $('tabs').innerHTML=names.map((n,i)=>'<button data-area="'+i+'" aria-pressed="'+(area===i)+'">'+n+'</button>').join('');
 const q=bank[id],ordered=[0,1,2,3].map((_,i)=>(i+id*7+dates.indexOf(day)+1)%4);
 $('quiz').innerHTML='<span class="chip">'+names[area]+' 연습</span><p class="prompt" lang="ja">'+q[1]+'</p><div class="opts">'+ordered.map((n,i)=>'<button data-choice="'+n+'" aria-pressed="'+(choice===n)+'" '+(feedback?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b>'+q[2+n]+'</button>').join('')+'<button data-choice="4" aria-pressed="'+(choice===4)+'" '+(feedback?'disabled':'')+'>모르겠어요</button></div>'+(feedback?'<div class="result" role="status"><b>'+(feedback.ok?'정답이에요':'오답이에요')+'</b> · 정답 '+q[2]+'<div class="row controls"><button id="why">'+(explain?'해설 접기':'해설 보기')+'</button><button id="bookmark">'+(db.saved[id]?'복습 목록에서 해제':'복습 목록에 저장')+'</button></div>'+(explain?'<p class="controls">'+q[6]+'</p>':'')+'</div><div class="row controls"><button class="primary" id="next">다음 문제</button></div>':'<button class="primary controls" id="check" '+(choice===null?'disabled':'')+'>정답 확인 · 기록</button>');

 const groups=names.map((n,i)=>db.log.filter(x=>Math.floor(x.id/12)===i));

function clock(){const d=dayState();if(d.start&&elapsed(d)>=1200000)stop(d);const s=Math.ceil((1200000-elapsed(d))/1000);$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('timer').textContent=d.start?'일시정지':s===0?'20분 완료':d.elapsed?'이어서 시작':'타이머 시작';$('timer').disabled=s===0}
$('focus').innerHTML='<option value="">자동 순환</option>'+names.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');
$('focus').onchange=e=>{dayState().focus=e.target.value;save();openQ(baseQ(e.target.value===''?dates.indexOf(day)%3:Number(e.target.value)))};

document.addEventListener('change',e=>{if(e.target.id==='library')dayState().library=e.target.checked;else if(e.target.id==='goal'){const v=e.target.value;if(v&&!e.target.checkValidity()){e.target.reportValidity();return}dayState().goal=v}else return;save();render()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const data=b.dataset;
 if(data.day)return dateOpen(data.day);
 if(data.area!==undefined)return openQ(baseQ(Number(data.area)));
 if(data.redo!==undefined){openQ(Number(data.redo));$('quiz').scrollIntoView({block:'center'});return}
 if(data.choice!==undefined){choice=Number(data.choice);return render()}
 switch(b.id){
 case 'check':if(choice===null||feedback)return;feedback={id,day,time:Date.now(),ok:choice===0,choice};db.log.push(feedback);if(!feedback.ok)db.saved[id]=true;save();break;
 case 'why':explain=!explain;break;
 case 'bookmark':if(db.saved[id])delete db.saved[id];else db.saved[id]=true;save();break;
 case 'next':{const logs=db.log.filter(x=>x.day===day),d=dayState(),focus=d.focus===''?dates.indexOf(day)%3:Number(d.focus);const areas=[focus,(focus+1)%3,(focus+2)%3];areas.sort((a,b)=>logs.filter(x=>Math.floor(x.id/12)===a).length-logs.filter(x=>Math.floor(x.id/12)===b).length);const a=areas[0],pool=Array.from({length:12},(_,i)=>a*12+(dates.indexOf(day)+i)%12).filter(i=>i!==id);const priority=retryList().find(i=>pool.includes(i)&&!logs.slice(-2).some(x=>x.id===i));return openQ(priority??pool.find(i=>!logs.some(x=>x.id===i))??pool.sort((a,b)=>(latest(a)?.time||0)-(latest(b)?.time||0))[0])}
 case 'finish':dayState().done=!dayState().done;if(dayState().done)stop(dayState());save();break;
 case 'timer':{const d=dayState();if(d.start)stop(d);else d.start=Date.now();save();break}
 default:return}render()});
